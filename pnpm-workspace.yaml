packages:
  - "apps/*"
  - "packages/*"

# Versões compartilhadas entre os pacotes (referencie com "catalog:")
catalog:
  "@types/node": "^22"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  tailwindcss: "^4.3.3"
  typescript: "~6.0.3"
  zod: "^4.6.7"

# Scripts de build de dependências: negados (binários vêm pré-compilados)
allowBuilds:
  esbuild: false
  unrs-resolver: false
