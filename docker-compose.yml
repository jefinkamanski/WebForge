# Apenas para desenvolvimento local. Em produção use o MySQL da hospedagem.
services:
  db:
    image: mysql:8.4
    container_name: meu-projeto-db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME:-site_platform}
      MYSQL_USER: ${DB_USER:-site_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
